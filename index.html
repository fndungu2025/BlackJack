<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blackjack</title>
  <meta name="description" content="A browser Blackjack game powered by the Deck of Cards API." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="login" id="login" hidden>
    <div class="login-card">
      <h1>Blackjack</h1>
      <p>Sign in to take a seat at the table.</p>
      <button class="btn google" id="google-login">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        Sign in with Google
      </button>
      <p class="login-error" id="login-error" role="alert"></p>
    </div>
  </section>

  <main class="table" id="table" hidden>
    <header class="topbar">
      <h1>Blackjack</h1>
      <div class="user" id="user">
        <img class="avatar" id="avatar" alt="" referrerpolicy="no-referrer" hidden />
        <span class="avatar initials" id="initials" hidden></span>
        <span class="greeting" id="greeting"></span>
        <button class="btn ghost small" id="logout">Sign out</button>
      </div>
      <div class="stats">
        <span>Bankroll: <strong id="bankroll">$0</strong></span>
        <span>Bet: <strong id="bet">$0</strong></span>
        <span class="shoe">Shoe: <strong id="remaining">–</strong> cards</span>
      </div>
    </header>

    <section class="hand-area" aria-label="Dealer">
      <h2>Dealer <span class="score" id="dealer-score"></span></h2>
      <div class="cards" id="dealer-cards"></div>
    </section>

    <div class="message" id="message" role="status" aria-live="polite">Place your bet to begin.</div>

    <section class="hand-area" aria-label="Player">
      <h2>You <span class="score" id="player-score"></span></h2>
      <div class="cards" id="player-cards"></div>
    </section>

    <section class="controls">
      <div class="chips" id="chips">
        <button class="chip" data-amount="5">$5</button>
        <button class="chip" data-amount="25">$25</button>
        <button class="chip" data-amount="100">$100</button>
        <button class="chip" data-amount="500">$500</button>
        <button class="btn ghost" id="clear-bet">Clear</button>
      </div>
      <div class="actions">
        <button class="btn primary" id="deal">Deal</button>
        <button class="btn" id="hit" hidden>Hit</button>
        <button class="btn" id="stand" hidden>Stand</button>
        <button class="btn" id="double" hidden>Double</button>
        <button class="btn primary" id="next" hidden>Next Hand</button>
        <button class="btn ghost" id="reset" hidden>Reset Bankroll</button>
      </div>
    </section>

    <footer class="rules">
      6-deck shoe · Blackjack pays 3:2 · Dealer stands on all 17s · Double on any first two cards ·
      Cards by <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">deckofcardsapi.com</a>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
